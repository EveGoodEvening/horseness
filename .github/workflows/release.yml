name: npm release
run-name: npm release ${{ inputs.phase }} ${{ inputs.version }} candidate=${{ inputs.candidate_run_id }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Release phase
        required: true
        type: choice
        options:
          - publish-next
          - verify-public
          - promote-latest
      version:
        description: Exact release version
        required: true
        default: 1.0.0
        type: string
      candidate_run_id:
        description: publish-next workflow run containing the candidate artifact
        required: false
        type: string
      verification_run_id:
        description: successful verify-public workflow run required for promotion
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ inputs.phase }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-candidate:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'publish-next'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run release:coherence
      - run: corepack pnpm run release:build-twice
      - run: corepack pnpm run release:verify-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-${{ inputs.version }}
          path: .release/build-1
          if-no-files-found: error
          retention-days: 7

  publish-next:
    needs: build-candidate
    if: github.ref == 'refs/heads/main' && inputs.phase == 'publish-next'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      RELEASE_VERSION: ${{ inputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ inputs.version }}
          path: .release/build-1
      - shell: bash
        run: node scripts/release/publish-next.mjs --candidate .release/build-1/release-manifest.json --version "$RELEASE_VERSION" --provenance

  verify-public:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'verify-public' && inputs.candidate_run_id != ''
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - name: Verify candidate workflow run
        shell: bash
        run: |
          actual="$(gh run view "$CANDIDATE_RUN_ID" --json conclusion,displayTitle,event,headBranch,workflowName --jq '[.conclusion,.event,.headBranch,.workflowName,.displayTitle] | join("|")')"
          expected="success|workflow_dispatch|main|npm release|npm release publish-next $RELEASE_VERSION candidate="
          test "$actual" = "$expected"
      - shell: bash
        run: gh run download "$CANDIDATE_RUN_ID" --name "npm-candidate-$RELEASE_VERSION" --dir .release/build-1
      - shell: bash
        run: node scripts/release/verify-public.mjs --candidate .release/build-1/release-manifest.json --version "$RELEASE_VERSION"

  promote-latest:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'promote-latest' && inputs.candidate_run_id != '' && inputs.verification_run_id != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - name: Verify upstream workflow runs
        shell: bash
        run: |
          candidate="$(gh run view "$CANDIDATE_RUN_ID" --json conclusion,displayTitle,event,headBranch,workflowName --jq '[.conclusion,.event,.headBranch,.workflowName,.displayTitle] | join("|")')"
          test "$candidate" = "success|workflow_dispatch|main|npm release|npm release publish-next $RELEASE_VERSION candidate="
          verification="$(gh run view "$VERIFICATION_RUN_ID" --json conclusion,displayTitle,event,headBranch,workflowName --jq '[.conclusion,.event,.headBranch,.workflowName,.displayTitle] | join("|")')"
          test "$verification" = "success|workflow_dispatch|main|npm release|npm release verify-public $RELEASE_VERSION candidate=$CANDIDATE_RUN_ID"
      - run: gh run download "$CANDIDATE_RUN_ID" --name "npm-candidate-$RELEASE_VERSION" --dir .release/build-1
      - run: node scripts/release/promote-latest.mjs --candidate .release/build-1/release-manifest.json --version "$RELEASE_VERSION"
      - name: Create or verify GitHub release
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          target="$(node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(".release/build-1/release-manifest.json","utf8"));if(!/^[0-9a-f]{40}$/.test(value.sourceCommit))process.exit(1);process.stdout.write(value.sourceCommit)')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$target"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" --target "$target" --title "$tag" --generate-notes
