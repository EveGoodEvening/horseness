name: npm release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Release phase
        required: true
        type: choice
        options:
          - publish-next
          - verify-public
          - promote-latest
      version:
        description: Exact release version
        required: true
        default: 1.0.0
        type: string
      candidate_run_id:
        description: publish-next workflow run containing the candidate artifact
        required: false
        type: string
      verification_run_id:
        description: successful verify-public workflow run required for promotion
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ inputs.phase }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-candidate:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'publish-next'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run release:coherence
      - run: corepack pnpm run release:build-twice
      - run: corepack pnpm run release:verify-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-${{ inputs.version }}
          path: .release/build-1
          if-no-files-found: error
          retention-days: 7

  publish-next:
    needs: build-candidate
    if: github.ref == 'refs/heads/main' && inputs.phase == 'publish-next'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ inputs.version }}
          path: .release/build-1
      - run: node scripts/release/publish-next.mjs --candidate .release/build-1/release-manifest.json --version "${{ inputs.version }}" --provenance

  verify-public:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'verify-public' && inputs.candidate_run_id != ''
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - run: gh run download "${{ inputs.candidate_run_id }}" --name "npm-candidate-${{ inputs.version }}" --dir .release/build-1
      - run: node scripts/release/verify-public.mjs --candidate .release/build-1/release-manifest.json --version "${{ inputs.version }}"

  promote-latest:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'promote-latest' && inputs.candidate_run_id != '' && inputs.verification_run_id != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - run: gh run view "${{ inputs.verification_run_id }}" --exit-status
      - run: gh run download "${{ inputs.candidate_run_id }}" --name "npm-candidate-${{ inputs.version }}" --dir .release/build-1
      - run: node scripts/release/promote-latest.mjs --candidate .release/build-1/release-manifest.json --version "${{ inputs.version }}"
      - name: Create or verify GitHub release
        shell: bash
        run: |
          tag="v${{ inputs.version }}"
          target="$(node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(".release/build-1/release-manifest.json","utf8"));if(!/^[0-9a-f]{40}$/.test(value.sourceCommit))process.exit(1);process.stdout.write(value.sourceCommit)')"
          if existing="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null)"; then
            test "$existing" = "$target"
            exit 0
          fi
          gh release create "$tag" --target "$target" --title "$tag" --generate-notes
