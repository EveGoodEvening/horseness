name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run release:verify-commands
      - run: corepack pnpm run release:verify-root-ceremony -- --schema docs/trust/root-ceremony-v1.schema.json --record docs/trust/root-ceremony-v1.json --evidence docs/trust/evidence --offline --threshold 2-of-2
      - run: corepack pnpm run release:verify-delegation -- --root-record docs/trust/root-ceremony-v1.json --require-version-range --require-kms-policy --require-two-approvals
      - name: Materialize verified production bootstrap trust root
        id: bootstrap-trust
        shell: bash
        run: |
          result="$(corepack pnpm run --silent release:materialize-bootstrap-trust-root)"
          echo "sha256=$(node -e 'const value=JSON.parse(process.argv[1]); if (!/^[0-9a-f]{64}$/.test(value.sha256)) process.exit(1); process.stdout.write(value.sha256)' "$result")" >> "$GITHUB_OUTPUT"
    outputs:
      bootstrap-trust-root-sha256: ${{ steps.bootstrap-trust.outputs.sha256 }}

  stage:
    needs: authorize
    uses: ./.github/workflows/release-stage.yml
    with:
      bootstrap-trust-root-sha256: ${{ needs.authorize.outputs.bootstrap-trust-root-sha256 }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  live:
    needs: stage
    uses: ./.github/workflows/live-gates.yml
    permissions:
      contents: read
    secrets: inherit

  finalize:
    needs: live
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: c22-signed-builds, path: .acceptance }
      - uses: actions/download-artifact@v4
        with: { name: c22-live-receipts, path: .acceptance }
      - run: corepack pnpm run release:dry-run
      - run: corepack pnpm run release:verify-no-static-secrets
      - name: Upload immutable candidate with lookup-first reconciliation
        run: corepack pnpm run release:upload-immutable -- --select-build build-1 --receipt-out .acceptance/C22-artifact-receipt.json
      - run: corepack pnpm run release:verify-artifact-receipt -- --checkpoint-subject C22
