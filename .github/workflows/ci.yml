name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Historical evidence / acceptance manifest
        run: node scripts/acceptance.mjs verify-manifest --subject C01 --version v4:C01-remediation
      - name: Historical evidence / architecture bootstrap
        run: node scripts/progress-cas.mjs verify-live-bootstrap --receipt docs/checkpoints/C00/bootstrap/0.json --checkpoint-index docs/checkpoints/index.jsonl --trust docs/checkpoints/trust.json --integrated-head HEAD --strict
      - name: Historical evidence / bootstrap receipt and resume
        run: |
          node scripts/progress-cas.mjs verify-live-receipt --receipt docs/checkpoints/C01/final/1.json --claim docs/claims/C01/1.json --remediation-claim docs/claims/R001/1.json --checkpoint-index docs/checkpoints/index.jsonl --trust docs/checkpoints/trust.json --integrated-head HEAD --strict
          node scripts/acceptance.mjs verify C01 docs/checkpoints/C01/final/1.json
          node scripts/progress-cas.mjs verify-live-resume --receipt docs/checkpoints/C01/final/1.json --claim docs/claims/C01/1.json --remediation-claim docs/claims/R001/1.json --checkpoint-index docs/checkpoints/index.jsonl --trust docs/checkpoints/trust.json --progress docs/progress.md --subject-progress docs/progress/C01.md --integrated-head HEAD --strict
      - name: Historical evidence / frozen candidate contracts
        run: |
          candidate=$(node -p 'JSON.parse(require("node:fs").readFileSync("docs/checkpoints/C01/final/1.json", "utf8")).core.candidateIntegrationSha')
          node scripts/progress-cas.mjs verify-live-remediation-claim --claim docs/claims/R001/1.json --original-claim docs/claims/C01/1.json --claim-index docs/claims/index.jsonl --finding docs/findings/F001.json --finding-index docs/findings/index.jsonl --checkpoint-index docs/checkpoints/index.jsonl --trust docs/checkpoints/trust.json --now 2026-08-11T17:30:00Z --integrated-head "$candidate" --strict
          snapshot=$(mktemp -d)
          trap 'rm -rf "$snapshot"' EXIT
          git archive "$candidate" | tar -x -C "$snapshot"
          (
            cd "$snapshot"
            node -e "$(cat docs/validation/c00-contract-gate.node-e.txt)"
            node scripts/c00-contract-gate.mjs
          )
      - name: Historical evidence / verifier fixtures
        run: node scripts/progress-cas.mjs verify-fixture-bundle --bundle docs/checkpoints/fixtures/c01-bundle-v1 --strict
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Lint documentation
        run: corepack pnpm run docs:lint
      - name: Typecheck packages
        run: corepack pnpm run typecheck
      - name: Lint source
        run: corepack pnpm run lint
      - name: Test packages
        run: corepack pnpm run test
      - name: Check package boundaries
        run: corepack pnpm run boundaries:check
      - name: Test release tooling
        run: corepack pnpm run release:test
      - name: Verify release commands
        run: corepack pnpm run release:verify-commands
      - name: Verify no static release secrets
        run: corepack pnpm run release:verify-no-static-secrets

  e2e:
    name: End-to-end / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Test system lifecycle and native task workflows
        shell: bash
        run: |
          set +e
          corepack pnpm run test:e2e 2>&1 | tee e2e.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            node -e 'const output=require("node:fs").readFileSync("e2e.log","utf8"); console.log("::error title=End-to-end diagnostics::"+output.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"));'
          fi
          exit "$result"

  c13-os:
    name: Daemon / ${{ matrix.receipt-os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            receipt-os: linux
          - runner: macos-latest
            receipt-os: macos
          - runner: windows-latest
            receipt-os: windows
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      HORSENESS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck daemon and protocol
        run: corepack pnpm --filter @horseness/daemon --filter @horseness/protocol run typecheck
      - name: Test daemon multiprocess behavior
        shell: bash
        run: |
          set +e
          corepack pnpm --filter @horseness/daemon run test:multiprocess 2>&1 | tee c13-multiprocess.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            node -e 'const output=require("node:fs").readFileSync("c13-multiprocess.log","utf8"); console.log("::error title=Daemon multiprocess diagnostics::"+output.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"));'
          fi
          exit "$result"
      - name: Record daemon verification result
        shell: bash
        env:
          RECEIPT_OS: ${{ matrix.receipt-os }}
        run: |
          mkdir -p .ci/os-receipts
          node -e 'const fs=require("node:fs"); const value={version:"horseness.os-receipt.v1",chunk:"C13",os:process.env.RECEIPT_OS,candidateSha:process.env.HORSENESS_CANDIDATE_SHA,gates:[{name:"c13:typecheck",status:"passed"},{name:"c13:multiprocess",status:"passed"}]}; fs.writeFileSync(`.ci/os-receipts/C13-${process.env.RECEIPT_OS}.json`,`${JSON.stringify(value)}\n`,{flag:"wx",mode:0o600});'
      - name: Upload daemon verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: c13-os-receipt-${{ matrix.receipt-os }}
          path: .ci/os-receipts/C13-${{ matrix.receipt-os }}.json
          if-no-files-found: error
          retention-days: 7

  c13-receipts:
    name: Daemon / cross-platform results
    needs: c13-os
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      HORSENESS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download daemon verification receipts
        uses: actions/download-artifact@v4
        with:
          pattern: c13-os-receipt-*
          path: .ci/os-receipts
          merge-multiple: true
      - name: Enable Corepack
        run: corepack enable
      - name: Verify all platforms passed for this commit
        run: corepack pnpm run ci:require-os-receipts -- C13 linux macos windows
