name: Installer smoke
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  c20:
    name: Installer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-latest
            os: macos
          - runner: windows-latest
            os: windows
    runs-on: ${{ matrix.runner }}
    env:
      CI: "true"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
      HORSENESS_OS_RECEIPTS_DIR: .ci/os-receipts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Typecheck installer, CLI, and bootstrap
        run: corepack pnpm --filter @horseness/installer --filter @horseness/cli --filter @horseness/bootstrap run typecheck
      - name: Test installer and CLI
        run: corepack pnpm --filter @horseness/installer --filter @horseness/cli run test
      - name: Build bootstrap executable
        run: corepack pnpm run bootstrap:build
      - name: Smoke-test online installation
        run: corepack pnpm run install:blackbox -- --clean-home --workspace "${{ runner.temp }}/horseness-fixture-workspace" --create-workspace --host all --accept-executable-risk fixture-release-digest
      - name: Smoke-test offline installation
        run: corepack pnpm run install:blackbox:offline -- --clean-home --workspace "${{ runner.temp }}/horseness-fixture-workspace" --create-workspace --host all --accept-executable-risk fixture-release-digest
      - name: Check doctor has no side effects on hostile input
        run: corepack pnpm run doctor:hostile-no-side-effects
      - name: Test uninstall failure recovery
        run: corepack pnpm run uninstall:failure-matrix
      - name: Test CLI installation lifecycle
        run: corepack pnpm run cli:lifecycle:blackbox -- install upgrade downgrade rollback retry-install uninstall doctor repair rebind-workspace smoke
      - name: Check package boundaries
        run: corepack pnpm run boundaries:check
      - name: Record installer verification result
        run: node scripts/bootstrap/write-c20-os-receipt.mjs ${{ matrix.os }} ${{ github.sha }}
      - name: Upload installer verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: C20-${{ matrix.os }}
          path: .ci/os-receipts/C20-${{ matrix.os }}.json
          if-no-files-found: error
