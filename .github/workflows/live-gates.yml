name: Required live gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-subscription-matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      CI: "1"
      TZ: UTC
      LANG: C
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run live-gates:required -- --matrix config/hosts/capability-matrix.v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: c22-live-receipts
          path: .acceptance/C22-*-live-receipt.json
          if-no-files-found: error
          retention-days: 1
